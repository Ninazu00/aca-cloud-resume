name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ninazu00/resume-backend:${{ github.event.workflow_run.head_sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ninazu00/resume-backend:${{ github.event.workflow_run.head_sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Push image
        run: |
          docker push ninazu00/resume-backend:${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name resume-backend \
            --resource-group resumeaca-rg \
            --image docker.io/ninazu00/resume-backend:${{ github.event.workflow_run.head_sha }}
